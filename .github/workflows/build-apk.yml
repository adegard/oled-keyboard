name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Rename APK
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "OledKeyboard-v${VERSION}-debug.apk"
          ls -la *.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: oled-keyboard-debug
          path: OledKeyboard-*-debug.apk

      - name: Report success to status branch
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin status || true
          git checkout status || git checkout --orphan status
          cp app/build/outputs/apk/debug/app-debug.apk ./oled-keyboard-debug.apk || true
          echo "{\"time\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"success\", \"sha\": \"${GITHUB_SHA}\"}" > build-status.json
          git add -f build-status.json oled-keyboard-debug.apk
          git commit -m "build: success ${GITHUB_SHA:0:7}" || true
          git push origin status

      - name: Report failure to status branch
        if: failure()
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin status || true
          git checkout status || git checkout --orphan status
          echo "{\"time\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"status\": \"failure\", \"sha\": \"${GITHUB_SHA}\"}" > build-status.json
          cp build.log build-error.log || true
          git add -f build-status.json build-error.log
          git commit -m "build: failure ${GITHUB_SHA:0:7}" || true
          git push origin status

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release-unsigned.apk "OledKeyboard-v${VERSION}-release-unsigned.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OledKeyboard ${{ github.ref_name }}
          files: OledKeyboard-*-release-unsigned.apk
          overwrite: true
          generate_release_notes: true
